services:
  - type: web
    name: finwiz-live-simulation
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT --workers 1
    disk:
      name: finwiz-persistent-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: FINWIZ_DB
        value: /var/data/finwiz_simulation.db
